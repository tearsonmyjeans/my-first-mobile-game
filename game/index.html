<title>Пиксельный завод</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Tiny5&display=swap">
<style>
/* Layout: one phone-width column: HUD, workshop tabs, pixel factory canvas, bottom sheet with context actions and card picks */
:root{
  --bg:#1b1624;
  --panel:#262033;
  --panel2:#30293f;
  --ink:#f1ecf7;
  --muted:#a79fbc;
  --line:#463d5a;
  --gold:#f2c14e;
  --green:#7ee081;
  --paper:#f3e9d2;
  --paper-ink:#2b2135;
  --r0:#8a93a0;--r1:#4f8fd6;--r2:#9b6bd6;--r3:#e0a32e;
  --pixel:"Tiny5","Courier New",monospace;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.money{display:flex;align-items:baseline;gap:8px;min-width:0}
.coin{width:14px;height:14px;background:var(--gold);box-shadow:0 0 0 2px #8a5a12;border-radius:3px;align-self:center;flex:none}
#money{font:400 28px/1 var(--pixel);font-variant-numeric:tabular-nums}
#rate{font:400 14px var(--pixel);color:var(--green)}
.lvl{display:flex;align-items:center;gap:8px}
#lvl{font:400 18px/1 var(--pixel);background:var(--gold);color:var(--paper-ink);border-radius:4px;padding:5px 7px;min-width:18px;text-align:center}
.xp{width:96px;display:flex;flex-direction:column;gap:3px}
.xpbar{height:8px;background:#110d17;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--green)}
#xptext{font:400 11px var(--pixel);color:var(--muted);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{font:400 13px/1.1 var(--pixel);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer;white-space:pre-line}
.tab[aria-pressed="true"]{background:var(--gold);border-color:#a8781a;color:var(--paper-ink)}
.tab.locked{color:var(--muted);border-style:dashed}
.tab.locked.ready{color:var(--gold);border-color:var(--gold)}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative}
#game{display:block;width:100%;max-width:100%;aspect-ratio:240/270;height:auto;image-rendering:pixelated;border-radius:10px;touch-action:manipulation;cursor:pointer}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(27,22,36,.92);border:2px solid var(--gold);color:var(--ink);font:400 14px/1.2 var(--pixel);padding:8px 12px;border-radius:6px;max-width:86%;text-align:center;pointer-events:none;transition:opacity .25s}
#toast[hidden]{display:block!important;opacity:0}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
#sheetBody{display:flex;flex-direction:column;gap:10px;min-height:120px}
.sheet h2{font:400 20px/1.1 var(--pixel);margin:0}
.sheet h3{font:400 12px/1.2 var(--pixel);letter-spacing:.06em;color:var(--muted);margin:2px 0 0;text-transform:uppercase}
.sheet p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:400 15px/1 var(--pixel);color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:9px 12px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--gold);border-color:#a8781a;color:var(--paper-ink)}
.btn.danger{background:#7a2e35;border-color:#4d1c22}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.footer{display:flex;gap:8px;flex-wrap:wrap}
.footer .btn{flex:1 1 auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--paper-ink);border:3px solid var(--rc);border-bottom-width:6px;border-radius:8px;padding:0 0 8px;cursor:pointer;min-width:0;font:inherit}
.card:active{transform:translateY(2px)}
.card .band{background:var(--rc);color:#fff;font:400 13px/1.1 var(--pixel);padding:6px 6px 5px;text-wrap:balance}
.card .top{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:0 7px;min-width:0}
.card .ic{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#e6d9bc;border-radius:4px;padding:2px}
.card .ct{overflow-wrap:anywhere;font:400 10px/1.15 var(--pixel);color:var(--rc);letter-spacing:.04em;text-transform:uppercase;filter:brightness(.8)}
.card .cd{font-size:12.5px;line-height:1.3;padding:0 7px}
.card .rar{font:400 10px/1 var(--pixel);color:#7a7088;padding:0 7px;margin-top:auto}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--panel2);border-radius:6px;padding:7px 8px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font:400 16px var(--pixel);font-variant-numeric:tabular-nums}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notes li::before{content:"+ ";color:var(--green);font-family:var(--pixel)}
.chip{display:inline-flex;align-items:center;gap:5px;font:400 12px/1 var(--pixel);background:var(--panel2);border:2px solid var(--rc,var(--line));border-radius:6px;padding:4px 7px 4px 4px}
.chip img{width:18px;height:18px;image-rendering:pixelated}
.prompt{border:2px dashed var(--green);border-radius:8px;padding:12px;font:400 16px/1.3 var(--pixel);color:var(--green)}
.sets{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.sets dt{font:400 14px var(--pixel)}
.sets dd{margin:0;color:var(--muted)}
.on{color:var(--green)!important}
@media (max-width:380px){.cards{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app">
  <header class="hud">
    <div class="money"><span class="coin" aria-hidden="true"></span><b id="money">0</b><span id="rate">+0/с</span></div>
    <div class="lvl"><span id="lvl" aria-label="Уровень">1</span><div class="xp"><div class="xpbar"><i id="xpbar"></i></div><span id="xptext"></span></div></div>
  </header>
  <nav class="tabs" aria-label="Цеха">
    <button class="tab" id="tab0" type="button" data-loc="0">Цех 1 · Доски</button>
    <button class="tab" id="tab1" type="button" data-loc="1">Цех 2 · Кирпичи</button>
    <button class="tab" id="tab2" type="button" data-loc="2">Цех 3 · Гвозди</button>
    <button class="tab" id="tab3" type="button" data-loc="3">Цех 4 · Стекло</button>
  </nav>
  <div class="stage">
    <canvas id="game" role="img" aria-label="Цех завода: места под станки и раздевалка с сотрудниками"></canvas>
    <div id="toast" hidden></div>
  </div>
  <section class="sheet" aria-live="polite">
    <div id="sheetBody"></div>
    <div class="footer">
      <button class="btn primary" id="btnCards" type="button" data-act="showOffers" hidden>Карты</button>
      <button class="btn" id="btnShop" type="button" data-act="shop">Магазин</button>
      <button class="btn" id="btnDeck" type="button" data-act="deck">Колода</button>
      <button class="btn" id="btnMenu" type="button" data-act="menu">Меню</button>
    </div>
  </section>
</div>

    return cv.toDataURL();

      if ((mode.kind === 'place' || mode.kind === 'upgrade') && cl >= 0 && cl !== l) { toast(`Эта карта для цеха «${LOCS[cl].name}»`); return; }
      if (mode.kind === 'place' && !s.machine) {
        if (CARDS[mode.card].machine === 'belt' && sl.some(z => z.machine === 'belt')) { toast('В этом цеху уже есть конвейер'); return; }
        finish(mode.card, { l, i });
      }
      else if (mode.kind === 'upgrade' && s.machine && s.machine !== 'belt') finish(mode.card, { l, i });
      else if (mode.kind === 'equip' && s.worker) finish(mode.card, s.worker);
      else if (mode.kind === 'move') {
        if (i !== mode.from) { [sl[mode.from], sl[i]] = [sl[i], sl[mode.from]]; toast('Станок переставлен'); save(); }
        mode = null; selSlot = i; renderSheet();
      }
      return;
    }
    if (selWorker) {
      if (!s.machine) { toast('Сначала поставь сюда станок'); return; }
      if (s.machine === 'belt') { toast('Конвейеру сотрудник не нужен'); return; }
      const prev = workerPlace(selWorker), other = s.worker, before = globals().combos;
      s.worker = selWorker;
      if (prev && !(prev.l === l && prev.i === i)) slotsOf(prev.l)[prev.i].worker = other;
      if (prev && prev.l !== l) toast(`${WORKERS[selWorker].name}: теперь в цеху ${l + 1}`);
      comboToast(before);
      selWorker = null; selSlot = i; save(); renderSheet(); return;
    }
    selSlot = selSlot === i ? null : i; renderSheet();
  }

  /* ================= tabs ================= */
  const tabs = LOCS.map((_, l) => l).map(l => document.getElementById('tab' + l));
  tabs.forEach((b, l) => b.addEventListener('click', () => {
    if (!state.locs[l].unlocked && state.cur === l) { unlockLoc(l); return; }
    if (mode && mode.kind === 'move') mode = null;
    state.cur = l; selSlot = null; renderSheet(); renderTabs();
  }));
  function renderTabs() {
    tabs.forEach((b, l) => {
      const L = state.locs[l];
      b.setAttribute('aria-pressed', String(state.cur === l));
      b.classList.toggle('locked', !L.unlocked);
      b.classList.toggle('ready', !L.unlocked && state.money >= LOCS[l].cost);
      const txt = L.unlocked ? `Цех ${l + 1}\n${LOCS[l].name}` : `Цех ${l + 1} · ${fmt(LOCS[l].cost)}\n${LOCS[l].name}`;
      if (b.textContent !== txt) b.textContent = txt;
    });
  }

  /* ================= sheet ================= */
  const body = document.getElementById('sheetBody');
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  const chip = id => `<span class="chip" style="--rc:${RAR_COL[CARDS[id].rar]}"><img src="${ICONS[id]}" alt="">${esc(CARDS[id].name)}</span>`;
  function cardHTML(id) {
    const cd = CARDS[id], cl = cardLoc(id);
    const kind = cd.type === 'machine' || cd.type === 'equip' ? cd.tag : `${TYPE_LABEL[cd.type]} · ${cd.tag}`;
    const M = cd.type === 'machine' && MACH[cd.machine];
    const where = (cl >= 0 ? `<br>${LOCS[cl].name}` : '') + (M && M.max ? `<br>есть ${machineCount(cd.machine)} из ${M.max}` : '');
    return `<button type="button" class="card r${cd.rar}" data-act="pick" data-id="${id}"><span class="band">${esc(cd.name)}</span><span class="top"><img class="ic" src="${ICONS[id]}" alt=""><span class="ct">${kind}${where}</span></span><span class="cd">${esc(cd.desc)}</span><span class="rar">${RAR[cd.rar]}</span></button>`;
  }
  const SRC = { level: 'Новый уровень', crate: 'Посылка', shop: 'Магазин' };
  function renderSheet() {
    let h = '';
    if (view === 'deck') h = deckHTML();
    else if (view === 'menu') h = menuHTML();
    else if (mode) {
      const txt = { place: 'Нажми на пустое место, куда поставить станок', equip: 'Нажми на сотрудника или его шкафчик', upgrade: 'Нажми на станок, который улучшить', move: 'Нажми на место, куда переставить станок' }[mode.kind];
      const extra = mode.card && CARDS[mode.card].machine === 'belt' ? '<p class="muted">Конвейер можно поставить в любой открытый цех, переключай цеха вкладками.</p>' : '';
      h = `${mode.card ? `<div class="row">${chip(mode.card)}</div>` : ''}<div class="prompt">${txt}</div>${extra}<div class="row"><button class="btn" type="button" data-act="cancel">Отмена</button></div>`;
    } else if (state.offers.length && !offersHidden) {
      const o = state.offers[0];
      h = `<div class="row" style="justify-content:space-between"><h2>${SRC[o.src] || 'Карта'}: выбери одну</h2>${state.offers.length > 1 ? `<span class="muted">ещё ${state.offers.length - 1}</span>` : ''}</div><div class="cards">${o.ids.map(cardHTML).join('')}</div><div class="row"><button class="btn" type="button" data-act="later">Позже</button></div>`;
    } else if (!state.locs[state.cur].unlocked) h = lockedHTML(state.cur);
    else if (selSlot != null) h = slotHTML(selSlot);
    else if (selWorker) h = workerHTML(selWorker);
    else h = idleHTML();
    body.innerHTML = h;
    const bc = document.getElementById('btnCards');
    bc.hidden = !(state.offers.length && offersHidden && view === 'main' && !mode);
    bc.textContent = `Карты: ${state.offers.length}`;
    updateLive();
  }
  function lockedHTML(l) {
    return `<h2>Цех ${l + 1} · ${LOCS[l].name}</h2><p class="muted">${LOCS[l].desc}</p><p class="muted">Сотрудники общие на весь завод: каждый может работать только в одном цеху.</p><div class="row"><button class="btn primary" type="button" data-act="unlock" ${state.money < LOCS[l].cost ? 'disabled' : ''}>Открыть за ${fmt(LOCS[l].cost)}</button></div>`;
  }
  function idleHTML() {
    const g = globals();
    const combos = g.combos.map(k => ({ night: '<span class="chip" style="--rc:var(--r3)">Ночная смена ×1,5</span>', saws: '<span class="chip" style="--rc:var(--r2)">Две пилорамы</span>', maids: `<span class="chip" style="--rc:var(--r3)">Дуэт горничных: цех ${g.maidsLoc + 1} ×2</span>`, green: '<span class="chip" style="--rc:var(--r2)">Зелёная сила ×1,5</span>', family: `<span class="chip" style="--rc:var(--r3)">Семейный подряд${g.familyLoc >= 0 ? `: цех ${g.familyLoc + 1} ×2` : ''}</span>` })[k]).join('');
    return `<h2>Цех ${state.cur + 1} · ${LOCS[state.cur].name}</h2><p class="muted">Нажми на шкафчик, а потом на станок, чтобы поставить туда сотрудника. Каждый сотрудник один на весь завод. Соседние станки усиливают друг друга, соседи по шкафчику дружат.</p>${combos ? `<h3>Активные комбо</h3><div class="row">${combos}</div>` : ''}<p class="muted">Досок: <b id="live-planks">0</b> · кирпичей: <b id="live-bricks">0</b> · гвоздей: <b id="live-nails">0</b> · стекла: <b id="live-glass">0</b></p>`;
  }
  function slotHTML(i) {
    const l = state.cur, s = slotsOf(l)[i];
    if (!s.machine) return `<h2>Свободное место ${i + 1}</h2><p class="muted">Сюда можно поставить станок из карты. Он сразу свяжется с соседями.</p>`;
    const M = MACH[s.machine], st = slotStats(l, i, globals());
    const worker = s.worker ? `<p>Работает: <b>${WORKERS[s.worker].name}</b></p>` : (s.machine === 'belt' ? '' : '<p class="muted">Нет сотрудника. Нажми на шкафчик, а потом на этот станок.</p>');
    const unit = LOCS[l].unit, unit1 = LOCS[l].unit1;
    const stats = s.machine === 'belt' ? '' : `<div class="stats"><div class="stat"><small>${unit} в сек.</small><b id="live-rate">0</b></div><div class="stat"><small>${unit1}</small><b id="live-value">0</b></div><div class="stat"><small>Доход в сек.</small><b id="live-income">0</b></div></div>`;
    const notes = st.notes.length ? `<h3>Бонусы</h3><ul class="notes">${st.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '<h3>Бонусы</h3><p class="muted">Пока нет. Поставь станки рядом или найди карты.</p>';
    const upg = s.upg.length ? `<h3>Карты станка</h3><div class="row">${s.upg.map(chip).join('')}</div>` : '';
    return `<h2>${M.name}</h2><p class="muted">${M.desc}</p>${worker}${stats}${notes}${upg}<div class="row"><button class="btn" type="button" data-act="move">Переставить</button>${s.worker ? '<button class="btn" type="button" data-act="unassign">Снять сотрудника</button>' : ''}</div>`;
  }
  function skillHTML(id) {
    const sk = SKILLS[id], has = state.workers[id].skill;
    return `<h3>Скилл</h3><p><b>${sk.name}</b>: ${esc(sk.desc)}</p>${has ? '<p class="on" id="live-skill"></p>' : `<div class="row"><button class="btn primary" type="button" data-act="skill" ${state.money < sk.cost ? 'disabled' : ''}>Открыть за ${fmt(sk.cost)}</button></div>`}`;
  }
  function workerHTML(id) {
    const Wd = WORKERS[id], st = state.workers[id], ws = workerStats(id, globals());
    const eq = st.equip.length ? st.equip.map(chip).join('') : '<span class="muted">Пусто</span>';
    const wp = workerPlace(id);
    const fr = ws.fr.length ? ws.fr.map(f => WORKERS[f].name).join(', ') + ` (+${pct(ws.fb)} силы)` : 'нет';
    return `<h2>${Wd.name}</h2><p class="muted">${Wd.role} · ${wp ? `работает: цех ${wp.l + 1}, ${MACH[slotsOf(wp.l)[wp.i].machine].name}` : 'отдыхает в раздевалке'}</p><div class="stats"><div class="stat"><small>Сила</small><b id="live-power">0</b></div><div class="stat"><small>Скорость</small><b id="live-speed">0</b></div><div class="stat"><small>Удача</small><b id="live-luck">0</b></div></div><p>${esc(Wd.perk)}</p>${skillHTML(id)}<h3>В шкафчике</h3><div class="row">${eq}</div><p class="muted">Друзья по шкафчику: ${fr}</p><p class="muted">Нажми на станок в любом цеху, чтобы перевести туда. Нажми на другой шкафчик, чтобы поменяться местами.</p>${wp ? '<div class="row"><button class="btn" type="button" data-act="rest">В раздевалку</button></div>' : ''}`;
  }
  function deckHTML() {
    const g = globals(), counts = {};
    state.cards.forEach(id => counts[id] = (counts[id] || 0) + 1);
    const sets = Object.keys(TAGS).map(tg => { const n = g.tc[tg] || 0, p = Math.floor(n / 2); return `<dt class="${p ? 'on' : ''}">${tg}: ${n}</dt><dd>${TAGS[tg]}. Комплектов: ${p}</dd>`; }).join('');
    const night = g.combos.includes('night'), saws = g.combos.includes('saws');
    const owned = Object.keys(counts).map(id => chip(id).replace('</span>', counts[id] > 1 ? ` ×${counts[id]}</span>` : '</span>')).join('') || '<span class="muted">Пока нет карт</span>';
    return `<h2>Колода</h2><h3>Комплекты по тегам</h3><dl class="sets">${sets}</dl><h3>Комбо</h3><dl class="sets"><dt class="${night ? 'on' : ''}">Ночная смена</dt><dd>Крепкий кофе + Конвейер + Бродяга: доход ×1,5</dd><dt class="${saws ? 'on' : ''}">Две пилорамы</dt><dd>Две пилорамы в цеху досок: +25% скорости обеим</dd><dt class="${g.sawWorking && anySlot(s => s.machine === 'kiln') ? 'on' : ''}">Растопка</dt><dd>Пилорама работает в цеху 1: печи в цеху 2 +25% скорости</dd><dt class="${g.kilnWorking && anySlot(s => s.machine === 'wire') ? 'on' : ''}">Закалка</dt><dd>Печь работает в цеху 2: проволока в цеху 3 +20% к цене</dd><dt class="${g.maidsLoc >= 0 ? 'on' : ''}">Дуэт горничных</dt><dd>V1 и V2 на соседних станках: доход их цеха ×2</dd><dt class="${g.green ? 'on' : ''}">Зелёная сила</dt><dd>Пришелец и Хаба на соседних станках: сила обоих ×1,5</dd><dt class="${g.combos.includes('family') ? 'on' : ''}">Семейный подряд</dt><dd>Хаба, Кастомка и Батя: соседям по станку из этой тройки +20% силы, все трое в одном цеху: доход цеха ×2</dd><dt class="${g.tumblerWorking && anySlot(s => s.machine === 'vitrage') ? 'on' : ''}">Рамы на гвоздях</dt><dd>Барабан работает в цеху 3: витражи в цеху 4 +20% к цене</dd></dl><h3>Твои карты</h3><div class="row">${owned}</div><div class="row"><button class="btn" type="button" data-act="back">Назад</button></div>`;
  }
  function menuHTML() {
    return `<h2>Меню</h2><p class="muted">Прогресс сохраняется в этом браузере. Пока игра закрыта, завод зарабатывает половину дохода (до 4 часов).</p><p class="muted">Уровень ${state.level} · всего заработано ${fmt(state.earned)} · досок ${fmt(state.planks)} · кирпичей ${fmt(state.bricks)} · гвоздей ${fmt(state.nails || 0)} · стекла ${fmt(state.glass || 0)}</p>${confirmReset ? '<p>Точно стереть весь прогресс?</p><div class="row"><button class="btn danger" type="button" data-act="reset-yes">Да, начать заново</button><button class="btn" type="button" data-act="reset-no">Отмена</button></div>' : '<div class="row"><button class="btn" type="button" data-act="back">Назад</button><button class="btn danger" type="button" data-act="reset">Начать заново</button></div>'}`;
  }
  function updateLive() {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    const g = globals();
    if (selSlot != null && state.locs[state.cur].unlocked) { const st = slotStats(state.cur, selSlot, g); if (st) { set('live-rate', fmt(st.rate)); set('live-value', fmt(st.value)); set('live-income', fmt(st.income)); } }
    if (selWorker && state.workers[selWorker].skill) {
      const w = state.workers[selWorker], sk = SKILLS[selWorker];
      set('live-skill', !workerPlace(selWorker) ? 'Срабатывает, только когда сотрудник у станка' : skillOn(selWorker) ? `Активен: ещё ${Math.ceil(sk.dur - w.skT)} с` : `Перезарядка: ${Math.ceil(sk.cd - w.skT)} с`);
    }
    if (selWorker) { const ws = workerStats(selWorker, g); set('live-power', fmt(ws.power)); set('live-speed', fmt(ws.speed)); set('live-luck', pct(ws.luck)); }
    set('live-planks', fmt(state.planks)); set('live-bricks', fmt(state.bricks)); set('live-nails', fmt(state.nails || 0)); set('live-glass', fmt(state.glass || 0));
  }
  document.querySelector('.sheet').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'pick') choose(b.dataset.id);
    else if (act === 'later') { offersHidden = true; renderSheet(); }
    else if (act === 'showOffers') { offersHidden = false; view = 'main'; selSlot = null; selWorker = null; renderSheet(); }
    else if (act === 'cancel') { if (mode.offer) state.offers.unshift(mode.offer); mode = null; renderSheet(); }
    else if (act === 'move') { mode = { kind: 'move', from: selSlot }; renderSheet(); }
    else if (act === 'unassign') { slotsOf(state.cur)[selSlot].worker = null; save(); renderSheet(); }
    else if (act === 'skill') {
      const sk = SKILLS[selWorker], w = state.workers[selWorker];
      if (w.skill || state.money < sk.cost) return;
      state.money -= sk.cost; w.skill = true; w.skT = 0; rollSkin(selWorker);
      toast(`Скилл «${sk.name}» открыт!`); save(); renderSheet();
    }
    else if (act === 'rest') { const wp = workerPlace(selWorker); if (wp) slotsOf(wp.l)[wp.i].worker = null; save(); renderSheet(); }
    else if (act === 'unlock') unlockLoc(state.cur);
    else if (act === 'deck') { view = view === 'deck' ? 'main' : 'deck'; renderSheet(); }
    else if (act === 'menu') { view = view === 'menu' ? 'main' : 'menu'; confirmReset = false; renderSheet(); }
    else if (act === 'back') { view = 'main'; renderSheet(); }
    else if (act === 'reset') { confirmReset = true; renderSheet(); }
    else if (act === 'reset-no') { confirmReset = false; renderSheet(); }
    else if (act === 'reset-yes') { state = fresh(); mode = null; selSlot = null; selWorker = null; view = 'main'; confirmReset = false; crate = null; floats = []; save(); renderSheet(); renderTabs(); toast('Новый завод!'); }
    else if (act === 'shop') {
      const cost = shopCost();
      if (state.money < cost) { toast(`Нужно ${fmt(cost)} монет`); return; }
      state.money -= cost; state.shopBuys++; view = 'main'; queueOffer('shop'); save();
    }
  });

  /* ================= hud + loop ================= */
  const $money = document.getElementById('money'), $rate = document.getElementById('rate'), $lvl = document.getElementById('lvl'),
    $xpbar = document.getElementById('xpbar'), $xptext = document.getElementById('xptext'), $shop = document.getElementById('btnShop'), $toast = document.getElementById('toast');
  let toastTimer = 0;
  function toast(msg) { $toast.textContent = msg; $toast.hidden = false; toastTimer = 2.6; }
  function hud() {
    $money.textContent = fmt(state.money);
    $rate.textContent = '+' + fmt(incomeNow) + '/с';
    $lvl.textContent = state.level;
    const nd = need(state.level);
    $xpbar.style.width = Math.min(100, state.xp / nd * 100) + '%';
    $xptext.textContent = `до ур. ${state.level + 1}: ${fmt(Math.max(0, nd - state.xp))}`;
    const cost = shopCost();
    $shop.textContent = `Магазин · ${fmt(cost)}`;
    $shop.disabled = state.money < cost;
    renderTabs();
    const ub = body.querySelector('[data-act="unlock"]');
    if (ub) ub.disabled = state.money < LOCS[state.cur].cost;
    const sb = body.querySelector('[data-act="skill"]');
    if (sb && selWorker) sb.disabled = state.money < SKILLS[selWorker].cost;
  }

  offlineGain();
  fit(); renderSheet(); renderTabs(); render(); hud();
  window.addEventListener('resize', () => { fit(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { offlineGain(); last = performance.now(); } });
  window.addEventListener('pagehide', save);

  let last = performance.now(), saveTimer = 0, liveTimer = 0;
  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    t += dt;
    tick(dt);
    render(); hud();
    liveTimer += dt; if (liveTimer > 0.25) { liveTimer = 0; updateLive(); }
    saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; save(); }
    if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $toast.hidden = true; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

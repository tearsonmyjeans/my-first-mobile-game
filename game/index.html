<title>Пиксельный завод</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Tiny5&display=swap">
<style>
/* Layout: one phone-width column: HUD, workshop tabs, pixel factory canvas, bottom sheet with context actions and card picks */
:root{
  --bg:#1b1624;
  --panel:#262033;
  --panel2:#30293f;
  --ink:#f1ecf7;
  --muted:#a79fbc;
  --line:#463d5a;
  --gold:#f2c14e;
  --green:#7ee081;
  --paper:#f3e9d2;
  --paper-ink:#2b2135;
  --r0:#8a93a0;--r1:#4f8fd6;--r2:#9b6bd6;--r3:#e0a32e;
  --pixel:"Tiny5","Courier New",monospace;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.money{display:flex;align-items:baseline;gap:8px;min-width:0}
.coin{width:14px;height:14px;background:var(--gold);box-shadow:0 0 0 2px #8a5a12;border-radius:3px;align-self:center;flex:none}
#money{font:400 28px/1 var(--pixel);font-variant-numeric:tabular-nums}
#rate{font:400 14px var(--pixel);color:var(--green)}
.lvl{display:flex;align-items:center;gap:8px}
#lvl{font:400 18px/1 var(--pixel);background:var(--gold);color:var(--paper-ink);border-radius:4px;padding:5px 7px;min-width:18px;text-align:center}
.xp{width:96px;display:flex;flex-direction:column;gap:3px}
.xpbar{height:8px;background:#110d17;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--green)}
#xptext{font:400 11px var(--pixel);color:var(--muted);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 26px;gap:5px;touch-action:pan-y}
.tab{font:400 13px/1.1 var(--pixel);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer;white-space:pre-line}
.tab[aria-pressed="true"]{background:var(--gold);border-color:#a8781a;color:var(--paper-ink)}
.tab.locked{color:var(--muted);border-style:dashed}
.tab.locked.ready{color:var(--gold);border-color:var(--gold)}
.tab:focus-visible,.tabpg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabpg{font:400 15px/1 var(--pixel);color:var(--gold);background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabpg small{font:400 9px/1 var(--pixel);color:var(--muted)}
.stage{position:relative}
#game{display:block;width:100%;max-width:100%;aspect-ratio:240/270;height:auto;image-rendering:pixelated;border-radius:10px;touch-action:manipulation;cursor:pointer}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(27,22,36,.92);border:2px solid var(--gold);color:var(--ink);font:400 14px/1.2 var(--pixel);padding:8px 12px;border-radius:6px;max-width:86%;text-align:center;pointer-events:none;transition:opacity .25s}
#toast[hidden]{display:block!important;opacity:0}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
#sheetBody{display:flex;flex-direction:column;gap:10px;min-height:120px}
.sheet h2{font:400 20px/1.1 var(--pixel);margin:0}
.sheet h3{font:400 12px/1.2 var(--pixel);letter-spacing:.06em;color:var(--muted);margin:2px 0 0;text-transform:uppercase}
.sheet p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:400 15px/1 var(--pixel);color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:9px 12px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--gold);border-color:#a8781a;color:var(--paper-ink)}
.btn.danger{background:#7a2e35;border-color:#4d1c22}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.footer{display:flex;gap:8px;flex-wrap:wrap}
.footer .btn{flex:1 1 auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--paper-ink);border:3px solid var(--rc);border-bottom-width:6px;border-radius:8px;padding:0 0 8px;cursor:pointer;min-width:0;font:inherit}
.card:active{transform:translateY(2px)}
.card:disabled{opacity:.45;cursor:default;transform:none}
.card .price{font:400 13px/1 var(--pixel);color:var(--paper-ink);padding:0 7px}
.card .band{background:var(--rc);color:#fff;font:400 13px/1.1 var(--pixel);padding:6px 6px 5px;text-wrap:balance}
.card .top{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:0 7px;min-width:0}
.card .ic{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#e6d9bc;border-radius:4px;padding:2px}
.card .ct{overflow-wrap:anywhere;font:400 10px/1.15 var(--pixel);color:var(--rc);letter-spacing:.04em;text-transform:uppercase;filter:brightness(.8)}
.card .cd{font-size:12.5px;line-height:1.3;padding:0 7px}
.card .minus{color:#c0392b;font-weight:700}
.card .gain{font:400 12px/1 var(--pixel);color:#2f7a3a;padding:0 7px}
.card .rar{font:400 10px/1 var(--pixel);color:#7a7088;padding:0 7px;margin-top:auto}
.card.mc{background:#24507e;color:#e8f1fb}
.card.mc .bp{margin:0 7px;height:80px;display:flex;align-items:center;justify-content:center;border:1px solid #6f9fd0;border-radius:4px;background-color:#1d4470;background-image:linear-gradient(#ffffff1c 1px,transparent 1px),linear-gradient(90deg,#ffffff1c 1px,transparent 1px);background-size:8px 8px;background-position:-1px -1px}
.card.mc .bp img{image-rendering:pixelated}
.card.mc .ct{color:#a9cdf2;filter:none;padding:0 7px}
.card.mc .st{display:flex;gap:4px;flex-wrap:wrap;padding:0 7px}
.card.mc .st span{font:400 11px/1 var(--pixel);border:1px solid #6f9fd0;border-radius:3px;padding:3px 4px;background:#ffffff14}
.card.mc .gain{color:#8fe39a}
.card.mc .rar,.card.mc .price{color:#a9cdf2}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--panel2);border-radius:6px;padding:7px 8px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font:400 16px var(--pixel);font-variant-numeric:tabular-nums}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notes li::before{content:"+ ";color:var(--green);font-family:var(--pixel)}
.chip{display:inline-flex;align-items:center;gap:5px;font:400 12px/1 var(--pixel);background:var(--panel2);border:2px solid var(--rc,var(--line));border-radius:6px;padding:4px 7px 4px 4px}
.chip img{width:18px;height:18px;image-rendering:pixelated}
.prompt{border:2px dashed var(--green);border-radius:8px;padding:12px;font:400 16px/1.3 var(--pixel);color:var(--green)}
.sets{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.sets dt{font:400 14px var(--pixel)}
.sets dd{margin:0;color:var(--muted)}
.on{color:var(--green)!important}
.cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.quota{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.quota.insp{border-color:#d9535a}
.qtop{display:flex;justify-content:space-between;gap:8px;font:400 13px/1.1 var(--pixel)}
.qtop span{font-variant-numeric:tabular-nums}
.qbar{height:8px;background:#110d17;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--gold)}
#qtext{font-size:12.5px;color:var(--muted)}
.quota.insp #qtext{color:#ffb3a6}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border-radius:6px;padding:7px 9px;font-size:14px}
.list li.done{box-shadow:inset 3px 0 0 var(--green)}
.list b{font:400 14px var(--pixel)}
.list small{display:block;color:var(--muted);font-size:12.5px}
.list .val{font:400 13px var(--pixel);color:var(--gold);white-space:nowrap}
.guest{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#2f4a3a;border:2px solid var(--green);border-radius:8px;padding:8px 10px;font:400 14px var(--pixel)}
textarea,.input{width:100%;box-sizing:border-box;background:#110d17;color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:8px;font:12px/1.3 ui-monospace,monospace}
.input{font:15px var(--body)}
textarea{height:84px;resize:vertical;word-break:break-all}
@media (max-width:380px){.cards{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app">
  <header class="hud">
    <div class="money"><span class="coin" aria-hidden="true"></span><b id="money">0</b><span id="rate">+0/с</span></div>
    <div class="lvl"><span id="lvl" aria-label="Уровень">1</span><div class="xp"><div class="xpbar"><i id="xpbar"></i></div><span id="xptext"></span></div></div>
  </header>
  <div class="quota" id="quota"><div class="qtop"><b id="qname">Квота 1</b><span id="qtime">3:00</span></div><div class="qbar"><i id="qbar"></i></div><span id="qtext"></span></div>
  <nav class="tabs" aria-label="Цеха">
    <button class="tab" id="tab0" type="button"></button>
    <button class="tab" id="tab1" type="button"></button>
    <button class="tab" id="tab2" type="button"></button>
    <button class="tab" id="tab3" type="button"></button>
    <button class="tab" id="tab4" type="button"></button>
    <button class="tabpg" id="tabPg" type="button" aria-label="Другая страница цехов"></button>
  </nav>
  <div class="stage">
    <canvas id="game" role="img" aria-label="Цех завода: места под станки и раздевалка с сотрудниками"></canvas>
    <div id="toast" hidden></div>
  </div>
  <section class="sheet" aria-live="polite">
    <div id="sheetBody"></div>
    <div class="footer">
      <button class="btn primary" id="btnCards" type="button" data-act="showOffers" hidden>Карты</button>
      <button class="btn primary" id="btnShift" type="button" data-act="shift" hidden>Начать смену</button>
      <button class="btn" id="btnShop" type="button" data-act="shop">Магазин</button>
      <button class="btn" id="btnDeck" type="button" data-act="deck">Колода</button>
      <button class="btn" id="btnMenu" type="button" data-act="menu">Меню</button>
    </div>
  </section>
</div>

  function makeIcon(draw) {
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    const x = cv.getContext('2d');
    // the colour '#00000000' erases pixels
    const r = (a, b, w, h, col) => { if (col === '#00000000') x.clearRect(a, b, w, h); else { x.fillStyle = col; x.fillRect(a, b, w, h); } };
    const dsk = (cx, cy, rad, col) => { for (let dy = -rad; dy <= rad; dy++) { const w = Math.round(Math.sqrt(rad * rad - dy * dy)); r(cx - w, cy + dy, w * 2 + 1, 1, col); } };
    // sh: a shape of rects with one K outline around all of them
    const sh = (rs, col) => { rs.forEach(([a, b, w, h]) => r(a - 1, b - 1, w + 2, h + 2, K)); rs.forEach(([a, b, w, h]) => r(a, b, w, h, col)); };
    draw(r, dsk, x, sh);
    return cv.toDataURL();
  }

robot') ? 'on' : ''}">Робот кормит улиток</dt><dd>Рука помощи + Зубастые улитки: в цеху с Рукой помощи минус улиток не действует</dd><dt class="${g.combos.includes('post') ? 'on' : ''}">Почтовый день</dt><dd>Почтальон + Курьер + Подписка: монеты в посылках ×2</dd><dt class="${g.combos.includes('morning') ? 'on' : ''}">Утро после</dt><dd>Сушняк и Газява у одного сотрудника: минус Сушняка снят, скорость ещё ×1,3</dd><dt class="${g.tape ? 'on' : ''}">Скотч и клей</dt><dd>Скотч братан + Супер клей: сотрудник у станка с клеем дружит со всеми соседями по станкам</dd><dt class="${g.lawn ? 'on' : ''}">Оборона газона</dt><dd>Подсолнух и Мухобойка на соседних станках: солнышки вдвое чаще, у Мухобойки сила ×1,5</dd><dt class="${g.epidemic ? 'on' : ''}">Эпидемия</dt><dd>Зомбачка и Могильщик на соседних станках: каждые 20 с смены укушен ещё один работник её цеха</dd><dt class="${g.rising ? 'on' : ''}">Восстание из мёртвых</dt><dd>Призрак вторника, Зомбачка и Могильщик в одном цеху: раз за забег квота, набранная хотя бы на 70%, засчитывается${state.run.rose ? ' (уже использовано)' : ''}</dd><dt class="${g.scarf ? 'on' : ''}">Тёплый шарф</dt><dd>Йети и Медаедь на соседних станках: шарф Йети готов с начала смены (+25% силы соседям), у Медаедя сила ×1,5</dd><dt class="${g.feat ? 'on' : ''}">Сам с собой фит</dt><dd>code10 и code80 на соседних станках: сила обоих ×1,5</dd><dt class="${g.same ? 'on' : ''}">Это одно и то же</dt><dd>Унитаз и аэрогриль на соседних станках цеха 10: сила обоих сотрудников ×2</dd><dt class="${g.sun ? 'on' : ''}">Лучи чужого солнца</dt><dd>Зоря из Зорвеля и Пришелец с Трёхглазиком на соседних станках: пицца стоит ×2</dd><dt class="${g.drink ? 'on' : ''}">Собутыльники</dt><dd>Сквонч и Батя на соседних станках: удача обоих +15%, монетка Сквонча всегда удачная</dd><dt class="${g.wolf ? 'on' : ''}">Счастливая волчица</dt><dd>Сильвер с Газявой: весь её доход ×2</dd><dt class="${g.compost && anySlot(s => s.machine === 'apple') ? 'on' : ''}">Компост</dt><dd>Верстак   }
  function friendsHTML() {
    return `<h2>Друзья</h2><p class="muted">Создай код и отправь другу в мессенджер. Он вставит его у себя и посмотрит твой завод и рекорды. Его код вставляй сюда же.</p><h3>Твой код</h3><input class="input" id="pname" maxlength="20" placeholder="Твоё имя" value="${esc(meta.name)}"><div class="row"><button class="btn primary" type="button" data-act="share">Создать и скопировать</button></div>${shareCode ? `<textarea readonly id="mycode">${shareCode}</textarea>` : ''}<h3>Код друга</h3><textarea id="fcode" placeholder="Вставь код сюда"></textarea><div class="row"><button class="btn primary" type="button" data-act="visit">В гости</button><button class="btn" type="button" data-act="menu">Назад</button></div>`;
  }

  /* ================= share codes ================= */
  // code = PF1 + base64 of deflated JSON {n: name, r: records, a: achievements, s: run state}; PF0 is the same without compression
  const pipe = (bytes, tr) => new Response(new Blob([bytes]).stream().pipeThrough(tr)).arrayBuffer().then(b => new Uint8Array(b));
  async function packCode() {
    let bytes = new TextEncoder().encode(JSON.stringify({ n: meta.name || 'Без имени', r: meta.records, a: meta.ach, s: state })), tag = 'PF0';
    if (window.CompressionStream) { bytes = await pipe(bytes, new CompressionStream('deflate-raw')); tag = 'PF1'; }
    let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    return tag + ':' + btoa(bin);
  }
  async function unpackCode(code) {
    const m = code.replace(/\s+/g, '').match(/^PF([01]):([A-Za-z0-9+/=]+)$/);
    if (!m) throw new Error('bad code');
    let bytes = Uint8Array.from(atob(m[2]), ch => ch.charCodeAt(0));
    if (m[1] === '1') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
    // a code from the previous build is brought up to date like a save
    const d = JSON.parse(new TextDecoder().decode(bytes)), st = d.s && d.s.v >= 9 && d.s.v <= 24 ? migrate(d.s) : d.s;
    // a friend's code is drawn with our code, so only known ids may pass
    const ok = st && st.v === 25 && st.run && (!st.run.stolen || CARDS[st.run.stolen]) && Array.isArray(st.locs) && st.locs.length === LOCS.length && st.locs.every((L, l) => Array.isArray(L.slots) && L.slots.length === LAYOUTS[l].length && L.slots.every(z => (!z.machine || MACH[z.machine]) && (!z.worker || WORKERS[z.worker]) && Array.isArray(z.upg) && z.upg.every(u => CARDS[u])))
      && Array.isArray(st.cards) && st.cards.every(id => CARDS[id]) && Object.keys(WORKERS).every(id => st.workers[id] && st.workers[id].equip.every(e => CARDS[e]))
      && Array.isArray(st.lockers) && st.lockers.every(id => WORKERS[id]) && d.r && Array.isArray(d.a);
    if (!ok) throw new Error('bad state');
    st.offers = []; st.cur = Math.max(0, Math.min(LOCS.length - 1, st.cur | 0));
    return { n: String(d.n).slice(0, 20), r: d.r, a: d.a.filter(id => ACH.some(x => x.id === id)), s: st };
  }
  function visit(d) {
    if (!guest) home = state;
    guest = d; state = d.s; incomeNow = totalIncome();
    view = 'main'; mode = null; selSlot = null; selWorker = null; crate = null; floats = [];
    renderSheet(); renderTabs();
  }
  function leave() {
    state = home; guest = null; home = null; incomeNow = state.run.over ? 0 : totalIncome();
    view = 'main'; selSlot = null; selWorker = null;
    renderSheet(); renderTabs();
  }
  function updateLive() {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    const g = globals();
    if (selSlot != null && state.locs[state.cur].unlocked) { const st = slotStats(state.cur, selSlot, g); if (st) { set('live-rate', fmt(st.rate)); set('live-value', fmt(st.value)); set('live-income', fmt(st.income)); } }
    if (selWorker && state.workers[selWorker].skill) {
      const w = state.workers[selWorker], sk = SKILLS[selWorker];
      const left = sk.shift ? quotaTime() - state.run.qT : skDur(selWorker) - w.skT;
      set('live-skill', !workerPlace(selWorker) ? 'Срабатывает, только когда сотрудник у станка' : skillOn(selWorker) ? `Активен: ещё ${Math.ceil(left)} с`
        : sk.shift ? (state.run.brk ? `Сработает в последние ${skDur(selWorker)} с смены` : `До скилла: ${Math.ceil(left - skDur(selWorker))} с`) : longSk(selWorker) && (state.run.brk || sk.cd - w.skT > quotaTime() - state.run.qT) ? (state.run.brk ? 'Сработает в начале смены' : 'Сработает в начале следующей смены') : `Перезарядка: ${Math.ceil(sk.cd - w.skT)} с`);
    }
    if (selWorker) { const ws = workerStats(selWorker, g); set('live-power', fmt(ws.power)); set('live-speed', fmt(ws.speed)); set('live-luck', pct(ws.luck)); }
    set('live-planks', fmt(state.planks)); set('live-bricks', fmt(state.bricks)); set('live-nails', fmt(state.nails || 0)); set('live-glass', fmt(state.glass || 0)); set('live-poufs', fmt(state.poufs || 0));
    NEW_GOODS.forEach(([id]) => set('live-' + id, fmt(state[id] || 0)));
  }
  document.querySelector('.sheet').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    // a friend's factory and a finished run are only for looking
    const viewOnly = ['back', 'deck', 'menu', 'ach', 'friends', 'share', 'visit', 'leave', 'buy', 'newrun', 'later', 'showOffers'];
    if ((guest || state.run.over) && !viewOnly.includes(act)) { toast(guest ? 'Это чужой завод, тут только смотрим' : 'Забег окончен'); return; }
    if (act === 'pick') choose(b.dataset.id);
    else if (act === 'buyCard') {
      const id = b.dataset.id;
      if (!buyCard(+b.dataset.i)) { toast(state.run.shopLocked ? 'Сначала обнови витрину' : `Нужно ${fmt(cardPrice(id))} монет`); return; }
      offersHidden = false; choose(id); save();
    }
    else if (act === 'rerollShop') {
      if (!rollNewShop()) return;
      save(); renderSheet();
    }
    else if (act === 'shift') {
      if (state.offers.length) { offersHidden = false; view = 'main'; selSlot = null; selWorker = null; renderSheet(); toast('Сначала выбери карты'); return; }
      if (!startShift()) return;
      view = 'main'; selSlot = null; selWorker = null; save(); renderSheet();
      toast(`Смена ${state.run.q} пошла! Квота ${fmt(curQuota())}`);
    }
    else if (act === 'reroll') {
      const rc = rerollCost();
      if (rule('audit') || state.money < rc || !state.offers.length) return;
      state.money -= rc; state.offers[0].ids = state.offers[0].src === 'mastery' ? rollMastery() : rollOffer(); save(); renderSheet();
    }
    else if (act === 'later') { offersHidden = true; renderSheet(); }
    else if (act === 'showOffers') { offersHidden = false; view = 'main'; selSlot = null; selWorker = null; renderSheet(); }
    else if (act === 'drop') finish(mode.card, mode.target, +b.dataset.i);
    else if (act === 'cancel') { if (mode.offer) state.offers.unshift(mode.offer); mode = null; renderSheet(); }
    else if (act === 'move') { mode = { kind: 'move', from: selSlot }; renderSheet(); }
    else if (act === 'unassign') { slotsOf(state.cur)[selSlot].worker = null; save(); renderSheet(); }
    else if (act === 'skill') {
      const sk = SKILLS[selWorker], w = state.workers[selWorker];
      const cost = skillCost(selWorker);
      if (w.skill || skillLocked() || state.money < cost) return;
      state.money -= cost; openSkill(selWorker);
      toast(`Скилл «${sk.name}» открыт!`); save(); renderSheet();
    }
    else if (act === 'rest') { const wp = workerPlace(selWorker); if (wp) slotsOf(wp.l)[wp.i].worker = null; save(); renderSheet(); }
    else if (act === 'counter') { state.run.counter = b.dataset.k; toast(b.dataset.k === 'cake' ? 'Прилавок тортов! Витрина придёт картой' : 'Прилавок хотдогов! Гриль придёт картой'); save(); renderSheet(); }
    else if (act === 'unlock') unlockLoc(b.dataset.l != null ? +b.dataset.l : state.cur);
    else if (act === 'deck') { view = view === 'deck' ? 'main' : 'deck'; renderSheet(); }
    else if (act === 'menu') { view = view === 'menu' ? 'main' : 'menu'; confirmQuit = false; renderSheet(); }
    else if (act === 'ach' || act === 'friends') { view = act; renderSheet(); }
    else if (act === 'back') { view = 'main'; renderSheet(); }
    else if (act === 'quit') { confirmQuit = true; renderSheet(); }
    else if (act === 'quit-no') { confirmQuit = false; renderSheet(); }
    else if (act === 'quit-yes') { confirmQuit = false; bankrupt(); }
    else if (act === 'newrun') { state = newRun(); mode = null; selSlot = null; selWorker = null; view = 'main'; crate = null; floats = []; save(); renderSheet(); renderTabs(); toast('Новый забег! Подготовься и начинай смену'); }
    else if (act === 'buy') {
      const u = UNLOCKS.find(x => x.id === b.dataset.id);
      if (!u || hasUnlock(u.id) || meta.rep < u.cost) return;
      meta.rep -= u.cost; meta.unlocks.push(u.id); saveMeta(); toast(`«${u.name}» открыто!`); renderSheet();
    }
    else if (act === 'share') {
      const inp = document.getElementById('pname');
      if (inp) { meta.name = inp.value.trim().slice(0, 20); saveMeta(); }
      const src = guest ? null : state;
      if (!src) { toast('Сначала вернись домой'); return; }
      packCode().then(code => {
        shareCode = code; renderSheet();
        const ta = document.getElementById('mycode');
        if (ta) { ta.focus(); ta.select(); }
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast('Код скопирован, отправь его другу'), () => toast('Скопируй код из поля ниже'));
        else toast('Скопируй код из поля ниже');
      }, () => toast('Не получилось создать код'));
    }
    else if (act === 'visit') {
      const ta = document.getElementById('fcode');
      unpackCode(ta ? ta.value : '').then(d => { visit(d); toast(`Ты в гостях у ${d.n}`); }, () => toast('Код не подошёл. Проверь, что он скопирован целиком'));
    }
    else if (act === 'leave') { leave(); toast('Ты снова дома'); }
    else if (act === 'shop') {
      if (!state.run.brk) { toast('Магазин открыт в перерыве между сменами'); return; }
      view = 'main'; mode = null; selSlot = null; selWorker = null; offersHidden = true; renderSheet();
    }
  });

  /* ================= hud + loop ================= */
  const $money = document.getElementById('money'), $rate = document.getElementById('rate'), $lvl = document.getElementById('lvl'),
    $xpbar = document.getElementById('xpbar'), $xptext = document.getElementById('xptext'), $shop = document.getElementById('btnShop'), $toast = document.getElementById('toast'),
    $quota = document.getElementById('quota'), $qname = document.getElementById('qname'), $qtime = document.getElementById('qtime'), $qbar = document.getElementById('qbar'), $qtext = document.getElementById('qtext');
  let toastTimer = 0;
  function toast(msg) { $toast.textContent = msg; $toast.hidden = false; toastTimer = 2.6; }
  function hud() {
    $money.textContent = fmt(state.money);
    $rate.textContent = '+' + fmt(incomeNow) + '/с';
    $lvl.textContent = state.level;
    const nd = need(state.level);
    $xpbar.style.width = Math.min(100, state.xp / nd * 100) + '%';
    $xptext.textContent = `до ур. ${state.level + 1}: ${fmt(Math.max(0, nd - state.xp))}`;
    const run = state.run, target = curQuota();
    $shop.textContent = run.brk ? 'Магазин' : 'Магазин в перерыве';
    $shop.disabled = !run.brk || !!guest || run.over;
    $quota.classList.toggle('insp', !!run.rule);
    $qname.textContent = run.over ? (run.won ? `Победа на квоте ${run.q - 1}` : `Банкротство на квоте ${run.q}`) : (run.brk ? `Перерыв · дальше смена ${run.q}` : `Смена ${run.q}`) + (run.rule ? ` · проверка «${RULES[run.rule.id].name}»` : '');
    $qtime.textContent = run.over ? '' : run.brk ? 'пауза' : mmss(Math.max(0, quotaTime() - run.qT));
    $qbar.style.width = (run.brk ? 0 : Math.min(100, run.qEarned / target * 100)) + '%';
    $qtext.textContent = (run.brk ? `Квота ${fmt(target)} за ${quotaTime()} с` : `${fmt(run.qEarned)} из ${fmt(target)}`) + (run.rule ? ` · ${ruleDesc(run.rule)}` : run.q % 3 === 2 ? ' · следующая смена с проверкой' : '');
    renderTabs();
    body.querySelectorAll('[data-act="unlock"]').forEach(ub => { ub.disabled = state.money < LOCS[ub.dataset.l != null ? +ub.dataset.l : state.cur].cost; });
    const sb = body.querySelector('[data-act="skill"]');
    if (sb && selWorker) sb.disabled = state.money < skillCost(selWorker);
  }

  fit(); renderSheet(); renderTabs(); render(); hud();
  if (legacyRep) toast(`Старый завод продан: +${legacyRep} репутации. Начинаем забеги!`);
  window.addEventListener('resize', () => { fit(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = performance.now(); });
  window.addEventListener('pagehide', save);

  let last = performance.now(), saveTimer = 0, liveTimer = 0;
  function loop(now) {
    // schedule the next frame first: an error in one frame must not stop the whole game
    requestAnimationFrame(loop);
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    t += dt;
    tick(dt);
    render(); hud();
    liveTimer += dt; if (liveTimer > 0.25) { liveTimer = 0; updateLive(); }
    saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; save(); }
    if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $toast.hidden = true; }
  }
  if (BOT) window.PF = { cardHTML, BAL, rollRule, get state() { return state; }, set state(v) { state = v; }, meta, tick, totalIncome, avgIncome, globals, eligible, finish, holder, isFull, unlockLoc, openCrate, cardPrice, skillCost, skillLocked, skillShare, buyCard, startShift, curQuota, rerollCost, rollNewShop, shopRollCost, rollOffer, ICONS, quotaTarget, quotaTime, newRun, workerPlace, slotStats, onStrike, slotOk, upgOk, adjacent, eatWorker, ALTS, rule, get crate() { return crate; }, CARDS, MACH, LOCS, SKILLS, LAYOUTS, WORKERS };
  else requestAnimationFrame(loop);
})();
</script>
